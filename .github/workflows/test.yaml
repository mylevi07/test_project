# .github/workflows/test.yml
name: Run Tests

# 触发条件：每次 push 到 main 分支时自动执行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}  
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests playwright pytest-html
          playwright install chromium --with-deps

      # 4. 运行 API 测试（生成报告）
      - name: Run API tests
        run: |
          pytest testcases/test_api/ --html=report_api.html --self-contained-html -v

      # 5. 运行 UI 测试（用 headless 模式）
      - name: Run UI tests
        run: |
          pytest testcases/test_ui/ --html=report_ui.html --self-contained-html -v

      # 6. 上传测试报告为 Artifact（可选，用于存档）
      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: report_api.html

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: report_ui.html